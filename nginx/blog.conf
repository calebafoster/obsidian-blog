server {
    listen 8080;
    server_name blog.tesselis.org;

    root /home/caleb/blog/public;
    index index.html;

    # Static files
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Subscriber API proxy
    location /subscribe {
        proxy_pass http://127.0.0.1:5000/subscribe;
        proxy_set_header Host $host;
    }

    location /unsubscribe {
        proxy_pass http://127.0.0.1:5000/unsubscribe;
        proxy_set_header Host $host;
    }
}
