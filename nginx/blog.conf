server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name blog.tesselis.org;

    ssl_certificate /etc/ssl/tesselis/cert.pem;
    ssl_certificate_key /etc/ssl/tesselis/key.pem;

    root BLOG_DIR/public;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /subscribe {
        proxy_pass http://127.0.0.1:5000/subscribe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /unsubscribe {
        proxy_pass http://127.0.0.1:5000/unsubscribe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.tesselis.org;
    return 301 https://$host$request_uri;
}
